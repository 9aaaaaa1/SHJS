<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>📂 TXT 文本提取工具-XIN</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      padding: 30px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    input, button {
      font-size: 16px;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #40a9ff;
    }

    #result a {
      display: block;
      margin-top: 10px;
      text-decoration: none;
      color: #1890ff;
    }

    #result a:hover {
      text-decoration: underline;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      max-width: 500px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📂 TXT 文本提取工具</h2>

    <input type="file" id="fileInput" accept=".txt"><br>
    <label>输入要提取的行数：</label>
    <input type="number" id="lineCount" min="1" value="5"><br>
    <button onclick="processFile()">提取并生成文件</button>

    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    function processFile() {
      const fileInput = document.getElementById('fileInput');
      const lineCount = parseInt(document.getElementById('lineCount').value);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (!fileInput.files[0]) {
        alert("请先选择 TXT 文件");
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const lines = e.target.result.split(/\r?\n/);
        const extractPart = lines.slice(0, lineCount).join("\n");
        const remainingPart = lines.slice(lineCount).join("\n");

        createDownloadLink(extractPart, '提取部分.txt');
        createDownloadLink(remainingPart, '剩余部分.txt');
      };
      reader.readAsText(fileInput.files[0]);
    }

    function createDownloadLink(text, filename) {
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.textContent = `📥 下载：${filename}`;
      document.getElementById('result').appendChild(link);
    }
  </script>

</body>
</html>
